<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020a12;
    font-family: sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Stars */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to   { opacity: 0.9; transform: scale(1.2); }
  }

  /* Teal radial glow behind card */
  .glow-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(0,200,180,0.13) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    width: 310px;
    padding: 40px 28px 36px;
    border-radius: 28px;
    background: rgba(5, 18, 30, 0.88);
    border: 2.5px solid #00ff88;
    box-shadow:
      0 0 18px 3px rgba(0,255,136,0.55),
      0 0 60px 10px rgba(0,255,136,0.18),
      inset 0 0 30px rgba(0,255,136,0.05);
    text-align: center;
    animation: fadeUp 0.7s cubic-bezier(.22,.68,0,1.2) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    margin: 0 auto 32px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(#00e5ff, #00ffcc, #00e5ff, #00b4d8, #00e5ff);
    animation: spinGrad 3s linear infinite;
    z-index: 0;
  }
  .avatar-wrap::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: transparent;
    box-shadow: 0 0 25px 8px rgba(0,229,255,0.5);
    z-index: 0;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px 6px rgba(0,229,255,0.4); }
    50%       { box-shadow: 0 0 35px 12px rgba(0,229,255,0.7); }
  }
  @keyframes spinGrad {
    to { transform: rotate(360deg); }
  }
  .avatar {
    position: relative;
    z-index: 1;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 15%;
    border: 4px solid #020a12;
    display: block;
    margin: 5px;
  }

  /* Button */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(135deg, #00e676, #00c853, #69f0ae);
    color: #000;
    font-size: 17px;
    font-weight: 800;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.3px;
    box-shadow:
      0 0 20px 4px rgba(0,230,118,0.6),
      0 6px 24px rgba(0,200,83,0.4);
    transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
    border-radius: inherit;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 30px 8px rgba(0,230,118,0.75), 0 8px 30px rgba(0,200,83,0.5);
    filter: brightness(1.08);
  }
  .btn:active { transform: scale(0.97); }
</style>
</head>
